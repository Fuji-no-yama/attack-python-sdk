[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
attack = ["data/**/*"]

[tool.setuptools.packages.find]
include = ["attack"]

[project]
name = "attack"
version = "1.0.0"
description = "attackデータにpythonで簡単にアクセスするためのライブラリです。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT" # © 2025 The MITRE Corporation. This work is reproduced and distributed with the permission of The MITRE Corporation.
authors = [
  { name = "Your Name", email = "your@email.com" }
]
dependencies = [
  "chromadb",
  "ipykernel>=7.1.0",
  "openai>=0.8.0",
  "openpyxl>=3.1.5",
  "pandas>=2.3.3",
  "platformdirs>=4.3.7",
  "pydantic-settings>=2.12.0",
]

[project.urls]
Homepage = "https://github.com/Fuji-no-yama/attack-python-sdk"

[tool.ruff]
select = ["ALL"]
ignore = ["D", "S", "PTH", "RET", "ASYNC", "T201", "RUF", "PLR0913"]
# D: ドックストリング関連
# S: 安全規則関連(picklなど)
# PTH: pathlib推奨
# RET: 戻り値の最適化
# ASYNC: 非同期関連
# T201: printの制限
# RUF: カタカナの「ノ」の制約など
# PLR0913: 関数引数個数制限

# 自動修正から除外したいルールを指定
unfixable = ["F401", "E501"] # 例: 未使用importや行長制限など
line-length = 150
