[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attack"
version = "1.0.0"
description = "attackデータにpythonで簡単にアクセスするためのライブラリです。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT" # © 2025 The MITRE Corporation. This work is reproduced and distributed with the permission of The MITRE Corporation.
authors = [
  { name = "Your Name", email = "your@email.com" }
]
dependencies = [
  "chromadb",
  "openai>=0.8.0",
  "openpyxl>=3.1.5",
  "pandas>=2.3.3",
  "platformdirs>=4.3.7",
  "pydantic-settings>=2.12.0",
  "python-dotenv",
  "tqdm",
]

[project.urls]
Homepage = "https://github.com/Fuji-no-yama/attack-python-sdk"

[tool.hatch.build.targets.wheel]
packages = ["attack"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.10",
    "ty>=0.0.29",
]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "S", "PTH", "RET", "ASYNC", "T201", "RUF", "PLR0913"]
# D: ドックストリング関連
# S: 安全規則関連(picklなど)
# PTH: pathlib推奨
# RET: 戻り値の最適化
# ASYNC: 非同期関連
# T201: printの制限
# RUF: カタカナの「ノ」の制約など
# PLR0913: 関数引数個数制限

# 自動修正から除外したいルールを指定
unfixable = ["F401", "E501"] # 例: 未使用importや行長制限など

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require external API keys (OpenAI)",
]
